    <script>
        $("div.payment_content").hide();
        $(".payment_date").click(function () {
            $(this).children("span").toggleClass("up");
            if ($("+div", this).css("display") == "none") {
                $("div.payment_content").slideUp();
                $(".payment_item").children(".payment_date").removeClass("open");
                $("+div", this).slideDown();
                $(".payment_date").children("span").removeClass("up");
                $(this).children("span").toggleClass("up");
                $(this).addClass("open");
            }
            else if ($("+div", this).css("display") !== "none"){
                $(this).removeClass("open");
                $("+div", this).slideUp();
            }
        })
    </script>
