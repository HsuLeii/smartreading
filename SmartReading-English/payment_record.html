        <script>
            $("div.payment_content").hide();

                $(this).children("span").toggleClass("up");
                if ($("+div", this).css("display") == "none") {
                    $("+div", this).slideDown();
                    $(this).addClass("open");
                } else if ($("+div", this).css("display") !== "none") {
                    $(this).removeClass("open");
                    $("+div", this).slideUp();
                }
            })
