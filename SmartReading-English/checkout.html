<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="SRE(SmartReading-English)是提供臺灣等英語學習者閱讀英語讀本的學習平臺。SRE透過閱讀能力檢測對學習者進行英語閱讀能力評估後，再運用AI技術將學習者的英語閱讀程度和文本難度進行適性配對，並推薦適合學習者閱讀能力的英語讀本，增加學習者對英語閱讀的樂趣。當學習者閱讀文本後，可透過讀後測驗，了解自己對文本的理解程度。" />
  <title>SmartReading-English</title>
  <link rel="shortcut icon" type="image/x-icon" href="image/favicon.ico">

  <!-- this page widgets CSS -->

  <!-- my core CSS -->
  <link rel="stylesheet" type="text/css" href="css/SREstyles.css">
</head>

<body>
  <header class="header">
  </header>
  <div class="slide">
    <img src="image/photo/slide/slide_grade.png" alt="">
  </div>
  <div class="main checkout">
    <div class="tittle">
      <h1>付款資訊</h1>
    </div>

    <div class="checkout_information_area">
            <div class="checkout_area">
              <div class="input_item">
                    <label for="name">姓名</label>
                    <input type="text" placeholder="請輸入姓名" id="name">
                </div>

                <div class="input_item">
                    <label for="phone">手機</label>
                    <input type="text" placeholder="請輸入手機" id="phone" autocomplete="tel">
                </div>

                <div class="input_item">
                    <label for="mail">E-mail</label>
                    <input type="text" placeholder="請輸入E-mail" id="mail">
                </div>

                <div class="input_item">
                    <label for="paying">
                        付款方式
                    </label>
                    <input type="text" value="信用卡(一次付清)" id="paying" disabled>
                </div>

                <div class="input_item">
                    <label for="receipt">收據資料</label>
                    <label class="radio-inline">
                      <input id="receipt1" type="radio" value="0" name="receipt">無須收據
                    </label>
                    <label class="radio-inline">
                      <input id="receipt2" type="radio" value="1" name="receipt">電子掃描影本收據
                    </label>
                </div>

                <div class="input_item input_item_confirm">
                  <button class="pay_btn">
                    <p>
                      前往結帳
                    </p>
                  </button>
                </div>
            </div>
        </div>

  </div>

  <footer>
  </footer>
  <script src="js/jquery-3.6.1.min.js"></script>
  <script src="js/all.js"></script>

  <!-- this page widgets JS -->
  <script src="js/fontawesome-free-6.1.1.min.js"></script>
  <script>
    $(document).ready(function () {
      $("header").load("header.html", function () {});
      $("footer").load("footer.html", function () {});
    });
  </script>

</body>

</html>
