<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="SRE(SmartReading-English)是提供臺灣等英語學習者閱讀英語讀本的學習平臺。SRE透過閱讀能力檢測對學習者進行英語閱讀能力評估後，再運用AI技術將學習者的英語閱讀程度和文本難度進行適性配對，並推薦適合學習者閱讀能力的英語讀本，增加學習者對英語閱讀的樂趣。當學習者閱讀文本後，可透過讀後測驗，了解自己對文本的理解程度。" />
  <title>SmartReading-English</title>
  <link rel="shortcut icon" type="image/x-icon" href="image/favicon.ico">

  <!-- this page widgets CSS -->
  <!-- modal -->
  <link rel="stylesheet" href="css/jquery.modal.min.css" />

  <!-- my core CSS -->
  <link rel="stylesheet" type="text/css" href="css/SREstyles.css">
</head>

<body>
  <header class="header">
  </header>
  <div class="slide">
    <img src="image/photo/slide/slide_grade.png" alt="">
  </div>
  <div class="main plans">
    <div class="tittle">
      <h1>方案內容</h1>
    </div>

    <div class="plan_introduce">
      <div class="plan_content_introduce_tittle">
        <h3>
          方案名稱<br/>
          【含診斷】3個月方案+1次DCEC英語閱讀能力診斷
        </h3>
      </div>

      <div class="plan_content_text">
        <h4>
          方案內容
        </h4>
        <p>
          (方案內容為文字後續會提供各方案內容文字檔)
        </p>
      </div>

      <div class="plan_content_price_area">
        <div class="plan_content_price_input">
          <div class="input-group">
              <label for="discount_code">優惠碼</label>
              <input id="discount_code" type="text" placeholder="請輸入優惠碼" value="">
              <button type="button" class="discount_code_btn">
                <p>使用</p>
              </button>
            </div>
        </div>

        <div class="plan_price_item">
            <p>
              原價：XXXX 元
            </p>
            <p>
              限定優惠方案：
            </p>
            <p>
              折扣金額：XXX
            </p>
            <div class="total_price">
              <h4>
                <span>NT$</span> 600
              </h4>
            </div>
          </div>
      </div>

      <div class="consent_input_item">
            <p class="consent_input_text">
              銷售協議<br />
              訂閱/購買/取得訂閱方案前請務必點閱下方銷售協議連結，請於勾選同意後進入購買流程
            </p>
            <input type="checkbox" id="agree_consent_input_1" data-target="#btn_1" class="consent_input_checkbox">

            <label for="agree_consent_input_1">
              <p class="consent_input_text">
                我已詳閱<a href="#sales_agreement" rel="modal:open" class="">銷售協議</a>並同意<br>
              </p>
            </label>

          </div>

          <button id="btn_1" class="plan_btn" disabled="disabled">
            <a href="checkout.html">立即購買</a>
          </button>
    </div>

    <div id="sales_agreement" class="modal sales_agreement_modal">
      <div class="sales_agreement_modal_area">
        <div class="sales_agreement_modal_content">
          <div class="sales_agreement_modal_title">
            <h4>銷售協議</h4>
          </div>

          <div class="sales_agreement_modal_text">
            <p>
              銷售協議內容<br/>
              銷售協議內容
            </p>
          </div>

          <div class="sales_agreement_modal_btn">
            <a href="#close-modal" rel="modal:close" class="button_hover">已詳閱</a>
          </div>
        </div>

      </div>
    </div>

  </div>

  <footer>
  </footer>
  <script src="js/jquery-3.6.1.min.js"></script>
  <script src="js/all.js"></script>

  <!-- this page widgets JS -->
  <script src="js/fontawesome-free-6.1.1.min.js"></script>
  <!-- modal -->
  <script src="js/jquery.modal.min.js"></script>

  <script>
    $(document).ready(function () {
      $("header").load("header.html", function () {});
      $("footer").load("footer.html", function () {});
    });

    $('.consent_input_item input[type="checkbox"]').change(function () {
      $("#btn_1").prop('disabled', !this.checked);
    });
  </script>

</body>

</html>
