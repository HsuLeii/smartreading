    <meta name="description"
        content="SRE(SmartReading-English)是提供臺灣等英語學習者閱讀英語讀本的學習平臺。SRE透過閱讀能力檢測對學習者進行英語閱讀能力評估後，再運用AI技術將學習者的英語閱讀程度和文本難度進行適性配對，並推薦適合學習者閱讀能力的英語讀本，增加學習者對英語閱讀的樂趣。當學習者閱讀文本後，可透過讀後測驗，了解自己對文本的理解程度。" />

<body>
    <header class="header">
    </header>


    <div class="main sign_up">

        <div class="tittle">
            <h1>個人會員註冊</h1>
        </div>

        <div class="sign_up_area">
            <div class="account_area">
                <div class="register_item">
                    <label for="account">
                        Email
                    </label>
                    <input name="" type="text" placeholder="請輸入信箱" value="" class="account" id="account">
                    <input type="submit" name="ctl00$Content_body$BtnSendCode" value="發送驗證碼" id="BtnSendCode" class="get_code_btn" disabled="">
                    <!-- <button type="button" class="get_code_btn">取得驗證碼</button> -->
                
                    <div class="email_status_row">
                        <span id="EmailStatus" class="register_status">此 Email 已被註冊。</span>
                    </div>
                </div>
                <div class="register_item">
                    <label for="user_code">驗證碼</label>
                    <input name="" type="text" placeholder="請輸入 6 位數驗證碼" id="user_code">
                    <input type="submit" name="ctl00$Content_body$BtnVerifyCode" value="驗證 Email" id="ctl00_Content_body_BtnVerifyCode" class="get_code_btn">
                </div>
                <!-- <div class="email_status_row">
                    <span id="EmailStatus" class="register_status">此 Email 已被註冊。</span>
                </div> -->
                <div class="register_item">
                    <label for="password">密碼</label>
                    <input name="" type="password" placeholder="請輸入密碼" maxlength="20" id="password" placeholder="請設定 8-20 位字元，需包含英文大、小寫及數字">
                    <ul class="password_rules">
                        <li id="ruleLength" class="">長度 8-20 字元</li>
                        <li id="ruleCase" class="">包含英文大寫及小寫</li>
                        <li id="ruleNumber" class="">包含數字</li>
                    </ul>
                </div>
                <div class="register_item">
                    <label for="review_password">確認密碼</label>
                    <input name="" type="password" placeholder="請再次輸入密碼" id="review_password">
                </div>
                <div class="sign_up_text prompts_text">
                    <p>
                        <i class="fa-solid fa-lightbulb"></i>「
                        請填寫實際使用者的真實姓名。若您是家長欲購買給孩子使用，請填寫孩子的資料，以利系統建立正確的學習紀錄與個人化推薦。
                    </p>
                </div>
                <div class="register_item">
                    <label for="Lname">姓</label>
                    <input name="" type="text" placeholder="請輸入姓" id="Lname">
                </div>
                <div class="register_item">
                    <label for="Fname">
                        名
                    </label>
                    <input name="" type="text" placeholder="請輸入名" id="Fname">
                </div>
                <div class="register_item">
                    <label for="city">
                        居住縣市
                    </label>
                    <select name="" id="city">
                        <option selected="selected" value="0">請選擇居住縣市</option>
                        <option value="1">台北市</option>
                        <option value="2">新北市</option>
                    </select>
                </div>
                <div class="register_item">
                    <label for="year">出生年份</label>
                    <select name="" id="year">
                        <option selected="selected" value="0">請選擇出生年份</option>
                        <option value="2017">2017</option>
                        <option value="2018">2018</option>
                        <option value="2019">2019</option>
                        <option value="2020">2020</option>
                    </select>
                </div>
                <div class="terms_row">
                    <input id="AgreeTerms" type="checkbox" name="ctl00$Content_body$AgreeTerms"><label for="AgreeTerms"> 我已閱讀並同意會員服務條款及隱私權政策</label>
                </div>
                <!-- <div class="sign_up_text">
                    <a href="" target="_blank" class="sign_up_text_link">查看會員服務條款及隱私權政策</a>
                </div> -->
                <div class="register_item register_item_confirm">
                    <input type="submit" name="ctl00$Content_body$BtnRegister" value="註冊" id="BtnRegister" class="signup_btn" disabled="">
                </div>
                <div class="register_item register_item_confirm">
                    <a href="login.html" class="signup_btn login_btn">返回登入</a>
                </div>
            </div>
        </div>

        <div id="sign_up_done_modal" class="modal sign_up_done_modal">
            <div class="sign_up_done_area">
                <div class="sign_up_done_content">
                    <h4 class="sign_up_done_title">會員註冊完成！</h4>

                    <div class="sign_up_done_text">
                        <p>
                            您的會員帳號已建立，請使用註冊的帳號Email與密碼登入。
                        </p>
                        <p>
                            立即前往<a href="http://">訂閱方案</a>，開啟您的英語適性閱讀之旅！
                        </p>
                    </div>

                    <div class="sign_up_done_link">
                        <a href="login.html">前往登入</a>
                    </div>
                </div>

            </div>
        </div>

        <div id="ctl00_Content_body_RegistrationDone" class="sign_up_done_modal">
	
            <div class="sign_up_done_area">
                <div class="sign_up_done_content">
                    <button type="button" class="sign_up_done_close" aria-label="關閉" onclick="document.getElementById('ctl00_Content_body_RegistrationDone').style.display='none';">×</button>
                    <h4 class="sign_up_done_title">會員註冊完成！</h4>
                    <div class="sign_up_done_text">
                        <p>您的個人會員帳號已建立，請使用註冊 Email 與密碼登入。</p>
                        <p>登入後即可選擇訂閱方案，開啟英語適性閱讀之旅。</p>
                    </div>
                    <div class="sign_up_done_link"><a href="logintp.aspx">前往登入</a></div>
                </div>
            </div>
        
</div>

    </div>
